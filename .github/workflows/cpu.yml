name: CPU course checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    env:
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-11-01
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-cpu.txt
      - run: python tools/course.py check
      - run: python tools/check_docs.py
      - run: python -m unittest discover -s tests -v
      - run: python -m practice.grade --module practice.solutions
      - run: python -m projects.evidence_agent
      - run: python -m projects.model_runtime
